<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aMax by Alvian - Cek Setoran</title>
    <!-- Load library sql.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- Load Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f7f6; 
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .header-brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-brand h1 {
            font-weight: 800;
            color: #1a365d;
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .header-brand p {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
            font-weight: 600;
        }
        .header-brand a {
            color: #3182ce;
            text-decoration: none;
        }
        .card { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%;
            max-width: 500px;
        }
        .upload-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        /* Styling Custom Button Upload */
        .upload-btn {
            display: inline-block;
            background-color: #3182ce;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.2);
        }
        .upload-btn:hover {
            background-color: #2b6cb0;
            transform: translateY(-2px);
        }
        input[type="file"] {
            display: none;
        }
        #file-name {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            color: #a0aec0;
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            margin-top: 10px; 
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { 
            padding: 14px 16px; 
            text-align: left; 
            border-bottom: 1px solid #edf2f7; 
        }
        th { 
            background-color: #f7fafc; 
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }
        td {
            font-size: 15px;
            color: #2d3748;
        }
        tr:last-child td {
            border-bottom: none;
        }
        #hasil { 
            margin-top: 25px; 
        }
        .footer-text {
            margin-top: 40px;
            font-size: 13px;
            color: #a0aec0;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .loading {
            text-align: center;
            color: #3182ce;
            font-weight: 600;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header-brand">
        <h1>aMax Dashboard</h1>
        <p>Developed by Alvian | IG: <a href="https://instagram.com/alviannnnm" target="_blank">@alviannnnm</a></p>
    </div>

    <div class="card">
        <div class="upload-wrapper">
            <label for="db-upload" class="upload-btn">
                <svg style="width:18px;height:18px;vertical-align:text-bottom;margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Pilih File .db
            </label>
            <input type="file" id="db-upload" accept=".db,.sqlite">
            <span id="file-name">Belum ada file yang dipilih</span>
        </div>
        
        <div id="hasil">
            <!-- Tabel hasil akan muncul di sini -->
        </div>
    </div>

    <div class="footer-text">
        "Hindari klerek plus dengan aplikasi aMax by alvian"
    </div>

<script>
    const config = {
        locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}`
    };

    initSqlJs(config).then(function(SQL) {
        document.getElementById("db-upload").addEventListener("change", function(event) {
            let file = event.target.files[0];
            if (!file) return;

            // Tampilkan nama file yang diupload
            document.getElementById("file-name").innerText = file.name;
            document.getElementById("hasil").innerHTML = "<div class='loading'>Membaca database...</div>";
            
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let Uints = new Uint8Array(e.target.result);
                    let db = new SQL.Database(Uints);

                    // Query persis seperti request
                    let query = `
                        SELECT 
                            nik_trans as NIK_Kasir,
                            SUM(cash - change_pay) as setoran
                        FROM tx_tsale;
                    `;
                    
                    let data = db.exec(query);
                    
                    if (data.length === 0) {
                        document.getElementById("hasil").innerHTML = "<p style='text-align:center;color:#e53e3e;'>Data tidak ditemukan.</p>";
                        return;
                    }

                    let kolom = data[0].columns;
                    let baris = data[0].values;

                    let htmlTabel = `<table><tr>`;
                    kolom.forEach(k => { htmlTabel += `<th>${k.replace('_', ' ')}</th>`; });
                    htmlTabel += "</tr>";

                    baris.forEach(b => {
                        htmlTabel += "<tr>";
                        b.forEach((isi, index) => { 
                            if (index === 1 && typeof isi === 'number') {
                                htmlTabel += `<td style="font-weight:600; color:#38a169;">Rp ${isi.toLocaleString('id-ID')}</td>`;
                            } else {
                                htmlTabel += `<td>${isi !== null ? isi : '-'}</td>`; 
                            }
                        });
                        htmlTabel += "</tr>";
                    });
                    htmlTabel += "</table>";

                    document.getElementById("hasil").innerHTML = htmlTabel;
                    
                } catch (error) {
                    document.getElementById("hasil").innerHTML = `<p style="text-align:center;color:#e53e3e;font-weight:600;">Error: Pastikan file .db valid dan memiliki tabel tx_tsale.</p>`;
                }
            };
            reader.readAsArrayBuffer(file);
        });
    });
</script>

</body>
</html>
